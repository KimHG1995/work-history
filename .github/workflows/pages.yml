name: 문서 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      site: ${{ steps.changes.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 변경 영향 확인
        id: changes
        run: node scripts/ci-changes.mjs "$RUNNER_TEMP/ci-changes.json"
      - name: 필요한 검사와 정적 빌드
        run: node scripts/run-ci.mjs "$RUNNER_TEMP/ci-changes.json"
        env:
          VITE_CHAT_API_URL: ${{ vars.VITE_CHAT_API_URL }}
      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.site == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.site == 'true'
        with:
          path: site/.vitepress/dist
  deploy:
    needs: build
    if: needs.build.outputs.site == 'true'
    # Docs-only runs never enter the deployment queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 오래된 사이트 배포 방지
        id: freshness
        run: node scripts/check-deploy.mjs
      - name: GitHub Pages 배포
        if: steps.freshness.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
