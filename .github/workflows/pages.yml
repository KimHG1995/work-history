name: 문서 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 이번 배포 대상 (configured는 운영 Pages, github는 기존 사이트 복구용)
        type: choice
        options: [configured, github, pages]
        default: configured
      confirm_pages:
        description: 기존 Pages 프로젝트에 정적 파일 배포를 승인합니다.
        type: boolean
        default: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      site: ${{ steps.changes.outputs.site }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 변경 영향 확인
        id: changes
        run: node scripts/ci-changes.mjs "$RUNNER_TEMP/ci-changes.json"
      - name: 공개 배포 설정 확정
        id: target
        if: steps.changes.outputs.site == 'true'
        run: node scripts/pages-config.mjs "$RUNNER_TEMP/site-deployment.json"
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          PAGES_DEPLOY_CONFIRMED: ${{ inputs.confirm_pages }}
          SITE_TARGET: pages
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          # Verification-only: public AdSense publisher identity, no ad loader or slot.
          ADS_MODE: verify
          ADS_PUBLISHER_ID: ca-pub-9486681340475427
          ADS_CSP_MODE: strict
          VITE_CHAT_API_URL: ${{ vars.VITE_CHAT_API_URL }}
      - name: 필요한 검사와 정적 빌드
        run: node scripts/run-ci.mjs "$RUNNER_TEMP/ci-changes.json" "$RUNNER_TEMP/site-deployment.json"
        env:
          VITE_CHAT_API_URL: ${{ vars.VITE_CHAT_API_URL }}
      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.site == 'true' && steps.target.outputs.target == 'github'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.site == 'true' && steps.target.outputs.target == 'github'
        with:
          path: site/.vitepress/dist
      - name: Pages 정적 산출물 검사와 포장
        if: steps.changes.outputs.site == 'true' && steps.target.outputs.target == 'pages'
        run: |
          node scripts/deploy-site.mjs --check "$RUNNER_TEMP/site-deployment.json" site/.vitepress/dist
          mkdir -p "$RUNNER_TEMP/pages-upload"
          cp "$RUNNER_TEMP/site-deployment.json" "$RUNNER_TEMP/pages-upload/deployment.json"
          cp -R site/.vitepress/dist "$RUNNER_TEMP/pages-upload/dist"
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.site == 'true' && steps.target.outputs.target == 'pages'
        with:
          name: cloudflare-pages-${{ github.sha }}
          path: ${{ runner.temp }}/pages-upload
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
  deploy:
    needs: build
    if: needs.build.outputs.site == 'true' && needs.build.outputs.target == 'github'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 오래된 사이트 배포 방지
        id: freshness
        run: node scripts/check-deploy.mjs
      - name: GitHub Pages 배포
        if: steps.freshness.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
  deploy_cloudflare:
    needs: build
    if: needs.build.outputs.site == 'true' && needs.build.outputs.target == 'pages'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-${{ github.sha }}
          path: ${{ runner.temp }}/pages-upload
      - name: Pages 토큰 이름 검증
        id: token
        run: node scripts/pages-token.mjs
        env:
          PAGES_TOKEN_SECRET: ${{ vars.CLOUDFLARE_PAGES_TOKEN_SECRET }}
      - name: 업로드 CLI 준비 (사이트 재빌드 없음)
        run: npm ci --ignore-scripts
      - name: 검증된 정적 파일만 Pages 업로드
        id: upload
        run: node scripts/deploy-site.mjs --upload "$RUNNER_TEMP/pages-upload/deployment.json" "$RUNNER_TEMP/pages-upload/dist"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets[steps.token.outputs.name] }}
          PAGES_DEPLOY_CONFIRMED: ${{ inputs.confirm_pages }}
      - name: 공개 페이지와 정적 파일 확인 (배포와 별도 결과)
        if: steps.upload.outputs.deployed == 'true'
        run: node scripts/verify-public-site.mjs "$RUNNER_TEMP/pages-upload/deployment.json" "$RUNNER_TEMP/pages-upload/dist"
