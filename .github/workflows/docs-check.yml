name: 문서 검증

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/validate-mermaid.mjs'
      - 'scripts/validate-docs.mjs'
      - 'scripts/prepare-site.mjs'
      - 'scripts/prepare-chat.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:docs
      - run: npm run test:mermaid
      - run: npm run docs:prepare
      - run: npm test
