name: 무료 AI 응답 진단
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose-chat.mjs
        env:
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
