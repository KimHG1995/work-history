name: 무료 AI 응답 진단
on:
  workflow_dispatch:
    inputs:
      recover:
        description: 정산 금액 0 확인 후 비용 검사 중단 상태 복구
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose-chat.mjs
        env:
          RECOVER_CHAT: ${{ inputs.recover }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
